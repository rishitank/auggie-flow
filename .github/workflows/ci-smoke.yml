name: CI Smoke

on:
  push:
    branches: [ main, feature/** ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Smoke test
        env:
          AUGGIE_FLOW_ENGINE: auggie
        run: |
          npm test --silent -- --config tests/jest.smoke.config.js

