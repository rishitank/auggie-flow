name: Auggie Upgrades

on:
  workflow_dispatch:
    inputs:
      run-args:
        description: 'Extra Auggie CLI args'
        required: false
        default: '--compact'
      reviewers:
        description: 'Comma-separated reviewers'
        required: false
        default: ''
      labels:
        description: 'Comma-separated PR labels'
        required: false
        default: 'dependencies,auggie'

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrades:
    uses: rishitank/auggie-dependabot/.github/workflows/auggie.yml@v1
    with:
      pr-labels: ${{ inputs.labels }}
      pr-reviewers: ${{ inputs.reviewers }}
      auggie-config-path: '.auggie.yml'
      auggie-run-args: ${{ inputs['run-args'] }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUGMENT_SESSION_AUTH: ${{ secrets.AUGMENT_SESSION_AUTH }}

